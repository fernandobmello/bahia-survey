<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pesquisa encerrada</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; color: #1e293b; padding: 24px;
  }
  .card {
    background: #fff; max-width: 460px; width: 100%;
    border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
    padding: 48px 32px; text-align: center;
  }
  .icon { font-size: 3rem; margin-bottom: 16px; }
  h1 { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 12px; }
  p { font-size: 1rem; line-height: 1.5; color: #64748b; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>A pesquisa está encerrada</h1>
    <p>Obrigado pelo seu interesse. A coleta de respostas já foi concluída e este questionário não está mais disponível.</p>
  </div>
</body>
</html>
